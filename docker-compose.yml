services:
  django:
    build: .
    image: aula-django:1.0
    env_file: .env
    environment:
      POSTGRES_HOST: db
    volumes:
      - arquivos:/app/media
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  nginx:
    image: nginx:stable-alpine
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      # O Django grava os arquivos; o Nginx só precisa lê-los.
      - arquivos:/app/media:ro
    depends_on:
      django:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    env_file: .env
    volumes:
      - dados_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

# Volumes nomeados: continuam existindo mesmo após remover os containers.
volumes:
  arquivos:
  dados_postgres:
